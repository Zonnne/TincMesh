# Xcode project definition for XcodeGen (https://github.com/yonaskolb/XcodeGen).
#   brew install xcodegen && xcodegen generate && open TincMesh.xcodeproj
name: TincMesh

options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  # tinc 1.1pre18 (vendored, SPTPS only) plus the iOS glue in TincCore/ios.
  TincCore:
    type: library.static
    platform: iOS
    sources:
      - path: TincCore/tinc
        headerVisibility: project
        excludes:
          - "COPYING*"
          - "AUTHORS"
      - path: TincCore/ios
        headerVisibility: project
      - path: TincCore/config.h
        headerVisibility: project
    settings:
      base:
        GCC_C_LANGUAGE_STANDARD: gnu11
        # Vendored tinc C code: clang modules clash with its vendored
        # struct definitions (e.g. struct icmp vs Darwin's ip_icmp.h).
        CLANG_ENABLE_MODULES: NO
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/TincCore
          - $(SRCROOT)/TincCore/tinc
          - $(SRCROOT)/TincCore/ios
        # Vendored upstream code: keep its warnings out of the build log.
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO
        SKIP_INSTALL: YES

  TincMesh:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "*.entitlements"
          - "Info.plist"
      - path: Shared
    dependencies:
      - target: TincCore
      - target: PacketTunnel
      - sdk: NetworkExtension.framework
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: TincMesh
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/TincMesh.entitlements
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/TincCore/include
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes:
          - "*.entitlements"
          - "Info.plist"
      - path: Shared
    dependencies:
      - target: TincCore
      - sdk: NetworkExtension.framework
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).PacketTunnel
        PRODUCT_NAME: PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/TincCore/include
        TARGETED_DEVICE_FAMILY: "1,2"
